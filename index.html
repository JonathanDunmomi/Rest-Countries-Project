<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Countries</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
</head>
<body>
    <section class="all">
        <nav>
            <div class="nav">
                <h3>Where in the world?</h3>
            </div>

            <div class="toggle-container">
                <button class="toggle-button" id="modeToggle">☀️</button>
                <h3>Dark mode</h3>
            </div>
        </nav>

        <section class="hero">
            <div class="search-box">
                <i class="fa fa-search" aria-hidden="true"></i>
                <input type="text" id="searchInput" placeholder="Enter country name...">
                <button class="btn" onclick="searchCountry()">Search</button>
            </div>
        </section>

        <div class="countries" id="countries">
            
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
